ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    DocumentRoot /var/www/app/after/public

    <Directory /var/www/app/after/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        # Every path that is not a real file goes to the front controller
        FallbackResource /index.php
    </Directory>

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
