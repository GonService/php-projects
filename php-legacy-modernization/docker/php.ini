expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 128M
post_max_size = 2M
upload_max_filesize = 1M
date.timezone = America/Sao_Paulo

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.validate_timestamps = 0
