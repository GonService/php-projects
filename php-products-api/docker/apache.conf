ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes

        # Every path that is not a real file goes to the front controller, for every HTTP method.
        # mod_php does not expose "Authorization: Bearer ..." to PHP, so copy it explicitly.
        RewriteEngine On
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
